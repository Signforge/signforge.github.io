        }

            max-width: 48px;
            width: 48px;
        }

        img {
            max-height: 50px;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin: 15px;
        }

        img:hover {
            transform: scale(1.2);
        }

        .confirmation {
            background-color: #020F17;
            border: solid white 1px;
            position: absolute;
            padding: 5px;
            top: 500px;
            visibility: hidden;
            font-size: 1rem;
            pointer-events: none;
            transition: top 0.05s, left 0.05s;

    <div id="confirmation" class="confirmation">Sign copied ! Paste it in-game !</div>

    <script>
        function copyToClipboard(url) {
            navigator.clipboard.writeText(url).then(() => {
            const confirmation = document.getElementById('confirmation');
            confirmation.style.visibility = 'visible';
        setTimeout(() => {
            confirmation.style.visibility = 'hidden';
            }, 2000);
           }).catch(err => {
        console.error('Failed to copy: ', err);
          });
        }
        document.addEventListener('mousemove', (event) => {
          const confirmation = document.getElementById('confirmation');
          confirmation.style.left = `${event.pageX + 20}px`;
          confirmation.style.top = `${event.pageY}px`;
        });
    </script>
