<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/signforge.svg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <title>Signforge for Trackmania</title>
    <style>
        html{
            cursor: url('images/cursor.svg'), 8 8, pointer;
        }
        body{
            max-width: 60vw;
            background-color: #0a0a0a;
            color: #a1a1a1;
            font-family: "Instrument Serif", serif;
            font-style: italic;
            margin: auto;
            padding: 100px;
            cursor: url('images/cursor.cur'), 8 8, pointer;
        }
        .header{
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }
        #logo{
            max-width: 48px;
        }
        h1{
            font-size: 16px;
            font-weight: 100;
        }
        h1:hover{
            color: white;
            transition: 0.5s;
        }
        #projects{
            margin-top: 300px;
        }
        .item{
            margin-bottom: 20px;
            border-bottom: 1px solid #a1a1a1;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            transition: 0.5s;
        }
        .item:hover{
            color: white;
            transition: 0.5s;
        }
        .right{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 0.5rem;
        }
        .right img{
            max-width: 18px;
        }
    </style>
</head>

<body>
    <div class="header">
        <img id="logo" src="images/signforge.svg">
        <h1>Signforge for Trackmania</h1>
    </div>
    <section id="projects">
        <div class="item">
            <div class="left"><p>Mudmasters</p></div>
            <div class="right"><p>2025</p><img src="images/arrowright.svg"></div>
        </div>
        <div class="item">
            <div class="left"><p>Obsidian Mapping</p></div>
            <div class="right"><p>2025</p><img src="images/arrowright.svg"></div>
        </div>
        <div class="item">
            <div class="left"><p>Glacial Events</p></div>
            <div class="right"><p>2025</p><img src="images/arrowright.svg"></div>
        </div>
        <div class="item">
            <div class="left"><p>Icy Campaign</p></div>
            <div class="right"><p>2025</p><img src="images/arrowright.svg"></div>
        </div>
        <div class="item">
            <div class="left"><p>9Moons</p></div>
            <div class="right"><p>2025</p><img src="images/arrowright.svg"></div>
        </div>
    </section>
    <section id="footer"></section>
</body>
</html>
