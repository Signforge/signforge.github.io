    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Fira+Code" rel="stylesheet">
    <title>Mudmasters 2</title>
    <style>
        body {
            background-color: #161616;
            color: white;
            font-family: "Fira Code", monospace;
            font-weight: lighter;
            font-optical-sizing: auto;
            font-style: normal;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        p {
            padding-top: -20px;
        }

        table {
            border-collapse: collapse;
            max-width: 100%;
            margin: auto;
        }

        th, td {
            padding: 10px;
            text-align: center;
            vertical-align: top;
            width: 400px;
        }

        img {
            max-height: 150px;
            max-width: 300px;
            cursor: pointer;
            transition: transform 0.2s ease;
            border: solid #FF772C 1px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        img:hover {
            transform: scale(0.9);
        }

        img#logo {
            border: none;
        }

        .confirmation {
            background-color: #FF772C;
            border: solid white 1px;
            color: white;
            position: absolute;
            padding: 5px;
            visibility: hidden;
            font-size: 1rem;
            pointer-events: none;
            transition: top 0.05s, left 0.05s;
        }

        /* Hide radio buttons */
        input[type="radio"] {
            display: none;
        }

        /* Tabs container for horizontal alignment */
        .tab-labels {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        /* Style tab labels */
        .tab-label {
            padding: 5px 20px 5px 20px;
            background: #161616;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
        }

        /* Change background color of the active tab */
        input[type="radio"]:checked ~ .tab-labels .tab-label {
            background: #FF772C;
            font-weight: bold;
            border-bottom: 2px solid white;
        }

        #tab1:checked ~ .tab-labels .tab-label:nth-of-type(1),
        #tab2:checked ~ .tab-labels .tab-label:nth-of-type(2),
        #tab3:checked ~ .tab-labels .tab-label:nth-of-type(3),
        #tab4:checked ~ .tab-labels .tab-label:nth-of-type(4),
        #tab5:checked ~ .tab-labels .tab-label:nth-of-type(5) {
            background: white;
            color: #161616;
            border-bottom: 2px solid white;
        }

        /* Hide all tab content by default */
        .tab-content {
            display: none;
            padding: 20px;
        }

        /* Show the selected tab's content */
        #tab1:checked ~ .tab-container .content-1,
        #tab2:checked ~ .tab-container .content-2,
        #tab3:checked ~ .tab-container .content-3,
        #tab4:checked ~ .tab-container .content-4,
        #tab5:checked ~ .tab-container .content-5 {
            display: block;
        }
    </style>
</head>

    <script>
        function copyToClipboard(url) {
            navigator.clipboard.writeText(url).then(() => {
                const confirmation = document.getElementById('confirmation');
                confirmation.style.visibility = 'visible';
                setTimeout(() => {
                    confirmation.style.visibility = 'hidden';
                }, 1000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        document.addEventListener('mousemove', (event) => {
            const confirmation = document.getElementById('confirmation');
            confirmation.style.left = `${event.pageX - 150}px`;
            confirmation.style.top = `${event.pageY - 50}px`;
        });
    </script>
