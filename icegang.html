    <meta charset="UTF-8">

    <link rel="icon" href="images/icegang.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code" rel="stylesheet">
    <title>Ice Gang</title>
    <style>
        body {
            background-color: #002536;
            color: #00d1b5;
            font-family: "Fira Code", monospace;
            font-weight: lighter;
            font-optical-sizing: auto;
            font-style: normal;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        table {
            border-collapse: collapse;
            max-width: 100%;
            margin: auto;
        }
        th, td {
            padding: 10px;
            text-align: center;
            vertical-align: top;
            width: 400px;
        }
        img {
            max-height: 200px;
            max-width: 100px;
            cursor: pointer;
            transition: transform 0.2s ease;
            border: solid #00d1b5 1px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        img:hover {
            transform: scale(1.2);
        }
        #logo {
            border: none;
            margin-top: 64px;
        }
        .confirmation {
            background-color: #00d1b5;
            border: solid white 1px;
            color: white;
            position: absolute;
            padding: 5px;
            visibility: hidden;
            font-size: 1rem;
            pointer-events: none;
            transition: top 0.05s, left 0.05s;
        }
        input[type="radio"] {
            display: none;
        }
        .tab-labels {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .tab-label {
            padding: 5px 20px 5px 20px;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
        }
        input[type="radio"]:checked ~ .tab-labels .tab-label {
            font-weight: bold;
            border-bottom: 2px solid white;
        }
        #tab1:checked ~ .tab-labels .tab-label:nth-of-type(1),
        #tab2:checked ~ .tab-labels .tab-label:nth-of-type(2),
        #tab3:checked ~ .tab-labels .tab-label:nth-of-type(3) {
            background: white;
            color: #002536;
            border-bottom: 2px solid white;
        }
        .tab-content {
            display: none;
            padding: 20px;
        }
        #tab1:checked ~ .tab-container .content-1,
        #tab2:checked ~ .tab-container .content-2,
        #tab3:checked ~ .tab-container .content-3 {
            display: block;
        }
    </style>
</head>

    <div id="confirmation" class="confirmation">Sign copied! Paste it in-game!</div>

    <script>
        function copyToClipboard(url) {
            navigator.clipboard.writeText(url).then(() => {
                const confirmation = document.getElementById('confirmation');
                confirmation.style.visibility = 'visible';
                setTimeout(() => {
                    confirmation.style.visibility = 'hidden';
                }, 1000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        document.addEventListener('mousemove', (event) => {
            const confirmation = document.getElementById('confirmation');
            confirmation.style.left = `${event.pageX - 150}px`;
            confirmation.style.top = `${event.pageY - 50}px`;
        });
    </script>
