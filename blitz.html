        body {
            background-color: #111111;
            color: #BFFF33;
            font-family: "Audiowide", monospace;
            font-optical-sizing: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        p {
            font-size: 12px;
            font-weight: 100;
            padding-top: -20px;
        }
        table {
            border-collapse: collapse;
            width: 90%;
            max-width: 1200px;
        }
        th {
            padding: 10px;
            text-align: center;
            font-size: 14px;
            width: 200px;
        }
        td {
            padding: 10px;
            text-align: center;
            vertical-align: top;
            width: 200px;
        }
        img#logo {
            max-width: 48px;
            width: 48px;
            border: none;
        }
        img {
            max-width: 200px;
            max-height: 100px;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin: 5px;
            border: 1px solid white;
        }
        img:hover {
            transform: scale(1.2);
        }
        .confirmation {
            background-color: #111111;
            border: solid #BFFF33 1px;
            position: absolute;
            padding: 5px;
            top: 500px;
            visibility: hidden;
            font-size: 1rem;
            pointer-events: none;
            transition: top 0.05s, left 0.05s;
        }
    </style>

    <div id="confirmation" class="confirmation">Sign copied ! Paste it in-game !</div>

    <script>
        function copyToClipboard(url) {
            navigator.clipboard.writeText(url).then(() => {
            const confirmation = document.getElementById('confirmation');
            confirmation.style.visibility = 'visible';
        setTimeout(() => {
            confirmation.style.visibility = 'hidden';
            }, 2000);
           }).catch(err => {
        console.error('Failed to copy: ', err);
          });
        }
        document.addEventListener('mousemove', (event) => {
          const confirmation = document.getElementById('confirmation');
          confirmation.style.left = `${event.pageX - 130}px`;
          confirmation.style.top = `${event.pageY - 20}px`;
        });
    </script>
