    <link href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SUSE+Mono&display=swap" rel="stylesheet">
    <title>Premier Ice League Season 3</title>
    <style>
        body {
            background-color: #111111;
            color: #FFDB78;
            font-family: "SUSE Mono", monospace;
            font-optical-sizing: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        table {
            border-collapse: collapse;
            width: 90%;
            max-width: 1200px;
        }
        th {
            padding: 10px;
            text-align: center;
            font-size: 1.2rem;
            width: 200px;
        }
        td {
            padding: 10px;
            text-align: center;
            vertical-align: top;
            width: 200px;
        }
        img#logo {
            max-width: 100px;
            width: 100px;
            border: none;
        }
        img {
            max-width: 200px;
            max-height: 100px;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin: 5px;
            border: 1px solid white;
        }
        img:hover {
            transform: scale(1.2);
        }
        .confirmation {
            background-color: #111111;
            border: solid #FFDB78 1px;
            position: absolute;
            padding: 5px;
            top: 500px;
            visibility: hidden;
            font-size: 1rem;
            text-align: center;
            pointer-events: none;
            transition: top 0.05s, left 0.05s;
        }
        .tab-content:nth-child(1) img {
            max-height: 100px;
        }

        .tab-content:nth-child(2) img {
            max-height: 100px;
        }
        input[type="radio"] {
            display: none;
        }
        .tab-labels {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .tab-label {
            padding: 5px 20px 5px 20px;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
        }
        input[type="radio"]:checked ~ .tab-labels .tab-label {
            background: #111111;
            border-bottom: 2px solid #FFDB78;
        }
        #tab1:checked ~ .tab-labels .tab-label:nth-of-type(1),
        #tab2:checked ~ .tab-labels .tab-label:nth-of-type(2) {
            background: #FFDB78;
            color: #111111;
            border-bottom: 2px solid #FFDB78;
        }
        .tab-content {
            display: none;
            padding: 20px;
        }
        #tab1:checked ~ .tab-container .content-1,
        #tab2:checked ~ .tab-container .content-2 {
            display: block;
        }
    </style>
</head>

    <div id="confirmation" class="confirmation">Sign copied !<br />Paste it in-game !</div>

    <script>
        function copyToClipboard(url) {
            navigator.clipboard.writeText(url).then(() => {
            const confirmation = document.getElementById('confirmation');
            confirmation.style.visibility = 'visible';
        setTimeout(() => {
            confirmation.style.visibility = 'hidden';
            }, 2000);
           }).catch(err => {
        console.error('Failed to copy: ', err);
          });
        }
        document.addEventListener('mousemove', (event) => {
          const confirmation = document.getElementById('confirmation');
          confirmation.style.left = `${event.pageX - 90}px`;
          confirmation.style.top = `${event.pageY - 20}px`;
        });
    </script>
